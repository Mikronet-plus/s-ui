name: Build and Push S-UI for MikroTik CHR

on:
  push:
    branches:
      - main  # یا master (مطمئن شو اسم برنچ اصلی‌ات چیست)
  workflow_dispatch: # برای اینکه بتوانی دستی هم دکمه اجرا را بزنی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push for MikroTik CHR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/s-ui-mikrotik:chr-amd64
